# Docker containers in this stack:
#   homepage, glances, speedtest-tracker, jellyseerr, flaresolverr
#
# The following services run natively (not in Docker):
#   jellyfin, sonarr, radarr, sabnzbd, prowlarr

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3000:3000"
    user: root                          # Must run as root for docker.sock access (Layer A: enableLogs)
    environment:
      - PUID=0
      - PGID=0
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allows reaching native host services on Linux
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro   # Layer A: Live log streaming via Xterm.js
    restart: unless-stopped

  glances:
    image: nicolargo/glances:latest
    container_name: glances
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GLANCES_OPT=-w
    ports:
      - "61208:61208"
    restart: unless-stopped

  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    environment:
      - PUID=1000
      - PGID=1000
      - APP_URL=http://localhost:8765
    ports:
      - "8765:80"
    volumes:
      - /var/lib/speedtest-tracker:/config
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    user: "jellyfin:jellyfin"
    environment:
      - LOG_LEVEL=debug
      - TZ=America/New_York
    ports:
      - "5055:5055"
    volumes:
      - /var/lib/jellyseerr:/app/config
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    ports:
      - "8191:8191"
    restart: unless-stopped
