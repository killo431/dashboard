# =============================================================================
# Homepage Dashboard — services.yaml
# =============================================================================
# Docker containers: homepage, glances, speedtest-tracker, jellyseerr, flaresolverr
# Native (non-Docker): jellyfin, sonarr, radarr, sabnzbd, prowlarr
#
# Cards for Docker containers include:
#   Layer A: enableLogs: true   — Live log stream via Docker socket → Xterm.js
#   Layer B: enableAction: true — Power/restart slider (Docker RestartPolicy)
#   Layer C: customapi widget   — Direct POST commands to service APIs
#
# URL conventions (Homepage runs inside Docker):
#   href: http://localhost:PORT        — opened by the user's browser (on the host)
#   widget url (native service):       http://host.docker.internal:PORT
#   widget url (Docker service):       http://<service-name>:<internal-port>
# =============================================================================

# ---------------------------------------------------------------------------
# Tab 1 · Media — Streaming & Requests
# ---------------------------------------------------------------------------
- Media:
    - Jellyfin:
        href: http://localhost:8096
        description: Media streaming server
        icon: jellyfin.png
        # Layer C — Force immediate library scan of the XFS pool
        widget:
          type: customapi
          url: http://host.docker.internal:8096
          headers:
            X-Emby-Token: "{{JELLYFIN_API_KEY}}"
          mappings:
            - field: TotalMediaCount
              label: Total Items
              format: number
          actions:
            - label: Refresh Library
              icon: mdi-refresh
              method: POST
              url: http://host.docker.internal:8096/Library/Refresh
              headers:
                X-Emby-Token: "{{JELLYFIN_API_KEY}}"

    - Jellyseerr:
        href: http://localhost:5055
        description: Media request management
        icon: jellyseerr.png
        docker:
          container: jellyseerr
          enableLogs: true    # Layer A
          enableAction: true  # Layer B
        widget:
          type: jellyseerr
          url: http://jellyseerr:5055
          key: "{{JELLYSEERR_API_KEY}}"

# ---------------------------------------------------------------------------
# Tab 2 · Automation — Arr Apps
# ---------------------------------------------------------------------------
- Automation:
    - Sonarr:
        href: http://localhost:8989
        description: TV series automation
        icon: sonarr.png
        # Layer C — Dispatch "MissingEpisodeSearch" command to Sonarr API
        widget:
          type: sonarr
          url: http://host.docker.internal:8989
          key: "{{SONARR_API_KEY}}"
          enableQueue: true
          actions:
            - label: Search Missing
              icon: mdi-magnify
              method: POST
              url: http://host.docker.internal:8989/api/v3/command
              headers:
                X-Api-Key: "{{SONARR_API_KEY}}"
              body: '{"name": "MissingEpisodeSearch"}'
            - label: Refresh Series
              icon: mdi-refresh
              method: POST
              url: http://host.docker.internal:8989/api/v3/command
              headers:
                X-Api-Key: "{{SONARR_API_KEY}}"
              body: '{"name": "RefreshSeries"}'

    - Radarr:
        href: http://localhost:7878
        description: Movie automation
        icon: radarr.png
        # Layer C — Dispatch "MissingMoviesSearch" command to Radarr API
        widget:
          type: radarr
          url: http://host.docker.internal:7878
          key: "{{RADARR_API_KEY}}"
          enableQueue: true
          actions:
            - label: Search Missing
              icon: mdi-magnify
              method: POST
              url: http://host.docker.internal:7878/api/v3/command
              headers:
                X-Api-Key: "{{RADARR_API_KEY}}"
              body: '{"name": "MissingMoviesSearch"}'
            - label: Refresh Movies
              icon: mdi-refresh
              method: POST
              url: http://host.docker.internal:7878/api/v3/command
              headers:
                X-Api-Key: "{{RADARR_API_KEY}}"
              body: '{"name": "RefreshMovie"}'

# ---------------------------------------------------------------------------
# Tab 3 · Downloads — NZB Stack
# ---------------------------------------------------------------------------
- Downloads:
    - SABnzbd:
        href: http://localhost:8080
        description: Usenet downloader
        icon: sabnzbd.png
        widget:
          type: sabnzbd
          url: http://host.docker.internal:8080
          key: "{{SABNZBD_API_KEY}}"

    - Prowlarr:
        href: http://localhost:9696
        description: Indexer aggregator (uses FlareSolverr for Cloudflare bypass)
        icon: prowlarr.png
        widget:
          type: prowlarr
          url: http://host.docker.internal:9696
          key: "{{PROWLARR_API_KEY}}"

    - FlareSolverr:
        href: http://localhost:8191
        description: Cloudflare challenge solver for Prowlarr
        icon: flaresolverr.png
        docker:
          container: flaresolverr
          enableLogs: true    # Layer A
          enableAction: true  # Layer B

# ---------------------------------------------------------------------------
# Tab 4 · System — Monitoring
# ---------------------------------------------------------------------------
- System:
    - Glances:
        href: http://localhost:61208
        description: System resource monitor
        icon: glances.png
        docker:
          container: glances
          enableLogs: true    # Layer A
          enableAction: true  # Layer B
        widget:
          type: glances
          url: http://glances:61208
          version: 4

    - Speedtest Tracker:
        href: http://localhost:8765
        description: Internet speed tracking
        icon: speedtest-tracker.png
        docker:
          container: speedtest-tracker
          enableLogs: true    # Layer A
          enableAction: true  # Layer B
        widget:
          type: speedtest
          url: http://speedtest-tracker:80
